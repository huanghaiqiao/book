<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文档</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css">
  <!-- 搜索插件 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <!-- 代码复制插件 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- 分页导航插件 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .sidebar {
      width: 250px;
    }
    .content {
      padding: 30px 60px;
    }
    .md-quick-links {
      border: 1px solid #e6e6e6;
      border-radius: 10px;
      padding: 12px 14px;
      margin: 12px 0 20px;
      background: #fafafa;
    }
    .md-quick-links h3 {
      margin: 0 0 10px;
      font-size: 16px;
    }
    .md-quick-links h4 {
      margin: 10px 0 6px;
      font-size: 14px;
      color: #666;
    }
    .md-quick-links ul {
      margin: 0;
      padding-left: 18px;
    }
    .md-quick-links li {
      margin: 4px 0;
    }
    .md-copy-btn {
      margin-left: 8px;
      border: 1px solid #d8d8d8;
      border-radius: 6px;
      background: #fff;
      padding: 1px 6px;
      font-size: 12px;
      cursor: pointer;
      line-height: 1.6;
    }
    .md-copy-btn:hover {
      border-color: #42b983;
      color: #42b983;
    }
    .md-copy-btn.copied {
      border-color: #42b983;
      color: #42b983;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const mdLinkGroups = {
      src: [],
      build: [
        'build/README.md',
        'build/SUMMARY.md',
        'build/zi-ding-yi-log.md'
      ]
    }

    function toDocsifyRoute(mdPath) {
      return '#/' + mdPath
    }

    function toAbsoluteDocsUrl(mdPath) {
      return window.location.origin + window.location.pathname + toDocsifyRoute(mdPath)
    }

    function setCopyState(button, text) {
      const oldText = button.textContent
      button.textContent = text
      button.classList.add('copied')
      setTimeout(function () {
        button.textContent = oldText
        button.classList.remove('copied')
      }, 1200)
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text)
        return
      }
      const textarea = document.createElement('textarea')
      textarea.value = text
      textarea.style.position = 'fixed'
      textarea.style.opacity = '0'
      document.body.appendChild(textarea)
      textarea.select()
      document.execCommand('copy')
      textarea.remove()
    }

    function appendCopyButtonForAnchor(anchor) {
      if (!anchor || anchor.dataset.copyEnhanced === '1') {
        return
      }
      const href = anchor.getAttribute('href') || ''
      if (!href.toLowerCase().includes('.md')) {
        return
      }
      anchor.dataset.copyEnhanced = '1'
      const btn = document.createElement('button')
      btn.className = 'md-copy-btn'
      btn.type = 'button'
      btn.textContent = '复制链接'
      btn.addEventListener('click', async function (event) {
        event.preventDefault()
        event.stopPropagation()
        const copyTarget = href.startsWith('http')
          ? href
          : window.location.origin + window.location.pathname + href
        try {
          await copyText(copyTarget)
          setCopyState(btn, '已复制')
        } catch (error) {
          setCopyState(btn, '复制失败')
        }
      })
      anchor.insertAdjacentElement('afterend', btn)
    }

    function enhanceMdLinksCopyButtons() {
      document.querySelectorAll('.sidebar a, .markdown-section a').forEach(appendCopyButtonForAnchor)
    }

    function renderQuickMdLinks() {
      const root = document.querySelector('.markdown-section')
      if (!root) {
        return
      }
      const old = document.getElementById('md-quick-links')
      if (old) {
        old.remove()
      }

      const panel = document.createElement('section')
      panel.id = 'md-quick-links'
      panel.className = 'md-quick-links'
      panel.innerHTML = '<h3>Markdown 快速入口</h3>'

      ;['src', 'build'].forEach(function (groupName) {
        const title = document.createElement('h4')
        title.textContent = groupName + ' /'
        panel.appendChild(title)

        const links = mdLinkGroups[groupName] || []
        if (!links.length) {
          const empty = document.createElement('p')
          empty.textContent = '当前没有可用的 .md 文件'
          panel.appendChild(empty)
          return
        }

        const ul = document.createElement('ul')
        links.forEach(function (mdPath) {
          const li = document.createElement('li')
          const anchor = document.createElement('a')
          anchor.href = toDocsifyRoute(mdPath)
          anchor.textContent = mdPath
          li.appendChild(anchor)

          const btn = document.createElement('button')
          btn.className = 'md-copy-btn'
          btn.type = 'button'
          btn.textContent = '复制链接'
          btn.addEventListener('click', async function () {
            try {
              await copyText(toAbsoluteDocsUrl(mdPath))
              setCopyState(btn, '已复制')
            } catch (error) {
              setCopyState(btn, '复制失败')
            }
          })
          li.appendChild(btn)

          ul.appendChild(li)
        })
        panel.appendChild(ul)
      })

      root.insertAdjacentElement('afterbegin', panel)
    }

    window.$docsify = {
      // 基本配置
      name: '文档',
      repo: 'huanghaiqiao/book',
      loadSidebar: true,
      loadNavbar: false,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',
      
      // 搜索配置
      search: {
        placeholder: '站内搜索',
        noData: '找不到结果',
        paths: 'auto',
        depth: 3
      },
      
      // 代码复制配置
      copyCode: {
        buttonText: '复制代码',
        errorText: '复制失败',
        successText: '复制成功'
      },
      
      // 分页导航配置
      pagination: {
        previousText: '上一页',
        nextText: '下一页',
        crossChapter: true,
        crossChapterText: true
      },

      // 页面渲染完成后增强 md 链接复制能力并展示入口
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            renderQuickMdLinks()
            enhanceMdLinksCopyButtons()
          })
        }
      ],
      
      // 其他配置
      coverpage: false,
      onlyCover: false
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
</body>
</html>
